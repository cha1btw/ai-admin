name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_admin
          POSTGRES_PASSWORD: ai_admin
          POSTGRES_DB: ai_admin_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U ai_admin -d ai_admin_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ai_admin:ai_admin@localhost:5435/ai_admin_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
